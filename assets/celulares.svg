<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Diversos modelos de celular</title>
  <desc id="desc">Ilustração de três aparelhos diferentes, com telas coloridas, sobre um fundo gamer azul.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#102d49"/></linearGradient>
    <linearGradient id="screen1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36d5ff"/><stop offset=".55" stop-color="#3966ed"/><stop offset="1" stop-color="#9d5bff"/></linearGradient>
    <linearGradient id="screen2" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00e5b2"/><stop offset=".5" stop-color="#067bd9"/><stop offset="1" stop-color="#132d72"/></linearGradient>
    <linearGradient id="screen3" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb552"/><stop offset=".55" stop-color="#ff557c"/><stop offset="1" stop-color="#733dca"/></linearGradient>
    <filter id="shadow" x="-.3" y="-.2" width="1.6" height="1.6"><feGaussianBlur in="SourceAlpha" stdDeviation="15"/><feOffset dy="16"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
