  <g fill="#c6eaff" opacity=".78"><circle cx="120" cy="170" r="4"/><circle cx="770" cy="110" r="5"/><circle cx="790" cy="465" r="3"/><circle cx="110" cy="470" r="3"/></g>
</svg>
