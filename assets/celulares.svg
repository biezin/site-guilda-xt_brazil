  <circle cx="450" cy="350" r="270" fill="#168cff" opacity=".09"/>
  <path d="M0 570Q220 475 450 595t450-20v125H0z" fill="#07101b" opacity=".75"/>
  <g filter="url(#shadow)" stroke="#dbe9fa" stroke-opacity=".38" stroke-width="3">
    <g transform="rotate(-15 280 360)"><rect x="170" y="115" width="225" height="455" rx="35" fill="#101a29"/><rect x="181" y="127" width="203" height="430" rx="27" fill="url(#screen2)"/><path d="M181 365q95-190 203-40v232H181z" fill="#052849" opacity=".5"/><circle cx="282" cy="143" r="5" fill="#101a29" stroke="none"/></g>
    <g transform="rotate(1 460 340)"><rect x="350" y="78" width="230" height="500" rx="38" fill="#111b2a"/><rect x="362" y="91" width="206" height="474" rx="29" fill="url(#screen1)"/><path d="M362 390q110-205 206-35v210H362z" fill="#111345" opacity=".48"/><rect x="431" y="103" width="68" height="14" rx="7" fill="#111b2a" stroke="none"/></g>
